<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    a { color: #dc9b42; } a:hover { color: #dc9b42; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<!--
  Boot is where a controller earns trust: it should say what it is doing and
  what it has not managed yet, not spin a logo. Local control never waits on
  the network, so WiFi failing here is reported, not fatal - the panel says so.
-->
<div style="width: 240px; height: 320px; background: #0e141a; color: #e6ecf1;
            display: flex; flex-direction: column; padding: 16px 16px 12px;
            box-sizing: border-box; gap: 10px">

  <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px">
    <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Chamber</span>
    <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">FridgeG5 &middot; 20260831</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px">

    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6fbf8e"
           stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.2 5.2L20 7"></path>
      </svg>
      <span style="font-size: 16px; font-weight: 600">Outputs safe</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6fbf8e"
           stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.2 5.2L20 7"></path>
      </svg>
      <span style="font-size: 16px; font-weight: 600">Probe 18.4 &deg;C</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6fbf8e"
           stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.2 5.2L20 7"></path>
      </svg>
      <span style="font-size: 16px; font-weight: 600">Display</span>
    </div>

    <!-- in progress: hollow marker, not a tick -->
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc9b42"
           stroke-width="2.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="8"></circle>
      </svg>
      <span style="font-size: 16px; font-weight: 600; color: #dc9b42">Joining Wi-Fi</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#46586a"
           stroke-width="2.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="8"></circle>
      </svg>
      <span style="font-size: 16px; font-weight: 600; color: #8fa3b4">Waiting for Pill</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 3px; margin-top: auto">
    <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">automation</span>
    <span class="num" style="font-size: 18px; font-weight: 700">192.168.1.63</span>
  </div>

  <div style="border-top: 1px solid #3a4a5a; padding-top: 10px; font-size: 14px;
              font-weight: 600; line-height: 1.4; color: #8fa3b4">
    Control does not wait for the network.</div>
</div>
</x-dc>
</body>
</html>
