<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    a { color: #dc9b42; } a:hover { color: #dc9b42; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<!--
  Neutrals are lifted from the web UI's values: #151d25 on #0e141a quantises to
  ~1.04:1 in RGB565 and would be invisible on this panel. Semantic colours
  (cool/warm/accent/ok) are unchanged.
  Numerals are sized for the WORST case string (-10.0), not the typical one.
-->
<div style="width: 240px; height: 320px; background: #0e141a; color: #e6ecf1;
            display: flex; flex-direction: column; padding: 14px 14px 12px;
            box-sizing: border-box; gap: 10px">

  <div style="display: flex; align-items: center; gap: 8px; background: {{s.bg}};
              border-radius: 4px; padding: 8px 10px">
    <div style="width: 11px; height: 11px; border-radius: 50%; background: {{s.color}};
                flex-shrink: 0"></div>
    <span style="font-size: 15px; font-weight: 800; letter-spacing: 0.06em;
                 color: {{s.color}}">{{s.label}}</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 600; color: #8fa3b4">
      {{s.detail}}</span>
  </div>

  <!-- integer reads at distance; the decimal is detail, so it is subordinate -->
  <div style="display: flex; align-items: baseline; justify-content: center; gap: 2px">
    <span class="num" style="font-size: 80px; font-weight: 800; line-height: 0.95">18</span>
    <span class="num" style="font-size: 40px; font-weight: 800">.4</span>
    <span style="font-size: 22px; font-weight: 600; color: #8fa3b4; margin-left: 4px">&deg;C</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
                 color: #8fa3b4">TARGET</span>
    <span class="num" style="font-size: 30px; font-weight: 700">20.0</span>
    <span style="font-size: 15px; font-weight: 600; color: #8fa3b4">&plusmn;1.0</span>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; border-top: 1px solid #3a4a5a;
              padding-top: 10px; margin-top: auto">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.05em;
                 color: #6fbf8e">PILL</span>
    <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">1.011 SG</span>
  </div>

  <div style="display: flex; align-items: center; gap: 14px">
    <!-- fan, running -->
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6fbf8e"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="2.2"></circle>
      <path d="M12 9.8V4a3.2 3.2 0 0 1 3 3.4c0 1.5-1.3 2.4-3 2.4Z"></path>
      <path d="M14.2 12H20a3.2 3.2 0 0 1-3.4 3c-1.5 0-2.4-1.3-2.4-3Z"></path>
      <path d="M9.8 12H4a3.2 3.2 0 0 0 3.4 3c1.5 0 2.4-1.3 2.4-3Z"></path>
    </svg>
    <!-- light, off -->
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#46586a"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6"></path><path d="M10 21h4"></path>
      <path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3Z"></path>
    </svg>
    <!-- door, closed -->
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#46586a"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="14" height="18" rx="1.5"></rect>
      <circle cx="15" cy="12" r="1"></circle>
    </svg>
    <span style="margin-left: auto; font-size: 14px; font-weight: 600; color: #8fa3b4">
      {{s.lock}}</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"state":{"editor":"enum","options":["idle","cooling","heating","dehumidifying"],"default":"cooling","section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    // Every state gets a tint - consistently, rather than idle alone using the
    // plain surface. Tints are lifted so they survive RGB565 quantisation.
    const map = {
      idle:          { label: 'IDLE',    color: '#8fa3b4', bg: '#1e2a36', detail: 'in band', lock: '' },
      cooling:       { label: 'COOLING', color: '#5ea2ce', bg: '#16283a', detail: '4m 12s',  lock: '' },
      heating:       { label: 'HEATING', color: '#e07a50', bg: '#33201a', detail: '1m 40s',  lock: '' },
      dehumidifying: { label: 'DEHUMID', color: '#dc9b42', bg: '#33280f', detail: 'reheat',  lock: '18m left' },
    };
    return { s: map[this.props.state] ?? map.cooling };
  }
}
</script>
</body>
</html>
