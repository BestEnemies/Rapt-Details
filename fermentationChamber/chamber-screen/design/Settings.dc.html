<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    a { color: #dc9b42; } a:hover { color: #dc9b42; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<!--
  Six rows, not seven: at 16px values the row box is ~29.5px, and seven rows
  plus the group header overran the 236px the list actually gets.
-->
<div style="width: 240px; height: 320px; background: #0e141a; color: #e6ecf1;
            display: flex; flex-direction: column; padding: 12px 12px 10px;
            box-sizing: border-box; gap: 8px">

  <div style="display: flex; align-items: baseline; gap: 8px">
    <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em">SETTINGS</span>
    <span class="num" style="margin-left: auto; font-size: 14px; font-weight: 600;
                 color: #8fa3b4">5 / 34</span>
  </div>

  <div style="display: flex; gap: 6px; flex-grow: 1; min-height: 0">

    <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">

      <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
                  color: #8fa3b4; padding: 0 2px">CONTROL</div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px;
                  background: #dc9b42; border-radius: 3px">
        <span style="font-size: 15px; font-weight: 700; color: #0e141a">Cooling hyst.</span>
        <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 800;
                     color: #0e141a">1.0</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px">
        <span style="font-size: 15px; font-weight: 600">Heating hyst.</span>
        <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 700;
                     color: #8fa3b4">1.0</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px">
        <span style="font-size: 15px; font-weight: 600">Compr. cooldown</span>
        <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 700;
                     color: #8fa3b4">5 min</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px">
        <span style="font-size: 15px; font-weight: 600">Mode switch</span>
        <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 700;
                     color: #8fa3b4">15 min</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px">
        <span style="font-size: 15px; font-weight: 600">Cooler enabled</span>
        <span style="margin-left: auto; font-size: 16px; font-weight: 700">Yes</span>
      </div>

      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 9px">
        <span style="font-size: 15px; font-weight: 600">Relay cycle time</span>
        <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 700;
                     color: #8fa3b4">30 sec</span>
      </div>
    </div>

    <div style="width: 4px; background: #3a4a5a; border-radius: 2px; flex-shrink: 0;
                position: relative">
      <div style="position: absolute; top: 12%; height: 20%; left: 0; right: 0;
                  background: #8fa3b4; border-radius: 2px"></div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #3a4a5a;
              padding-top: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fa3b4"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path>
    </svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fa3b4"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path>
    </svg>
    <span style="margin-left: auto; font-size: 14px; font-weight: 700; color: #dc9b42">EDIT</span>
    <span style="font-size: 14px; font-weight: 700; color: #8fa3b4">BACK</span>
  </div>
</div>
</x-dc>
</body>
</html>
