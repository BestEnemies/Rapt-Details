<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    a { color: #dc9b42; } a:hover { color: #dc9b42; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<!--
  Sized down from the first pass: the instruction ran to three lines and the
  value numeral was 54px, which put this screen ~13px over its 294px budget.
-->
<div style="width: 240px; height: 320px; background: #0e141a; color: #e6ecf1;
            display: flex; flex-direction: column; padding: 14px 14px 12px;
            box-sizing: border-box; gap: 9px">

  <div style="display: flex; align-items: baseline; gap: 8px">
    <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em">CALIBRATION</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 600; color: #8fa3b4">
      point 1</span>
  </div>

  <div style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #8fa3b4">
    Immerse the probe in a fluid of known temperature.</div>

  <div style="display: flex; align-items: baseline; justify-content: center; gap: 6px;
              background: #33280f; border-radius: 4px; padding: 8px">
    <span class="num" style="font-size: 48px; font-weight: 800; line-height: 1;
                 color: #dc9b42">0.0</span>
    <span style="font-size: 20px; font-weight: 700; color: #dc9b42">&deg;C</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 5px; background: #1e2a36;
              border-radius: 4px; padding: 9px 10px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">Probe now</span>
      <span class="num" style="margin-left: auto; font-size: 22px; font-weight: 800">4.7</span>
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">&deg;C</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">ADC</span>
      <span class="num" style="margin-left: auto; font-size: 16px; font-weight: 700;
                   color: #8fa3b4">2683</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px">
      <div style="width: 10px; height: 10px; border-radius: 50%; background: #6fbf8e;
                  flex-shrink: 0"></div>
      <span style="font-size: 14px; font-weight: 700; color: #6fbf8e">Stable</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #3a4a5a;
              padding-top: 9px; margin-top: auto">
    <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">point 2 not set</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 700; color: #6fbf8e">SET</span>
    <span style="font-size: 14px; font-weight: 700; color: #8fa3b4">BACK</span>
  </div>
</div>
</x-dc>
</body>
</html>
