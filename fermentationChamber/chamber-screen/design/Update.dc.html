<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
    a { color: #dc9b42; } a:hover { color: #dc9b42; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<!--
  Stock wording throughout, including the restart notice - the "press any
  button to delay" affordance matters, because an unattended restart in the
  middle of a ferment is not always welcome.
-->
<div style="width: 240px; height: 320px; background: #0e141a; color: #e6ecf1;
            display: flex; flex-direction: column; padding: 14px 14px 12px;
            box-sizing: border-box; gap: 11px">

  <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em">FIRMWARE UPDATE</div>

  <div style="font-size: 16px; font-weight: 600; line-height: 1.35">
    Downloading new firmware update&hellip;</div>

  <div style="display: flex; align-items: baseline; gap: 6px">
    <span class="num" style="font-size: 52px; font-weight: 800; line-height: 0.95;
                 color: #dc9b42">64</span>
    <span style="font-size: 22px; font-weight: 700; color: #dc9b42">%</span>
    <span class="num" style="margin-left: auto; font-size: 15px; font-weight: 700;
                 color: #8fa3b4">610 / 953 KB</span>
  </div>

  <div style="height: 10px; background: #1e2a36; border-radius: 3px; overflow: hidden">
    <div style="width: 64%; height: 100%; background: #dc9b42"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 5px; background: #1e2a36;
              border-radius: 4px; padding: 9px 10px; margin-top: auto">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">Installed</span>
      <span class="num" style="margin-left: auto; font-size: 15px; font-weight: 700">20230607</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">Incoming</span>
      <span class="num" style="margin-left: auto; font-size: 15px; font-weight: 700;
                   color: #dc9b42">20260831</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa3b4">Slot</span>
      <span style="margin-left: auto; font-size: 15px; font-weight: 700">ota_1</span>
    </div>
  </div>

  <div style="border-top: 1px solid #3a4a5a; padding-top: 10px; font-size: 14px;
              font-weight: 600; line-height: 1.4; color: #8fa3b4">
    Will restart when done. Press any button to delay.</div>
</div>
</x-dc>
</body>
</html>
