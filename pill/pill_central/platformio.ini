[env:esp32dev]
; pinned to an Arduino-core 2.0.x release (IDF 4.4) that matches NimBLE-Arduino 1.4.3
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv        ; two OTA app slots for wireless updates
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    tzapu/WiFiManager@^2.0.17
    ayushsharma82/ElegantOTA@^3.1.6
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0
